name: CI

on: workflow_dispatch

permissions:
  contents: read
  checks: write

jobs:
  check-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read automatic check suite preferences
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '{}' | gh api --method PATCH "repos/$GH_REPO/check-suites/preferences" --input - --jq '.preferences'
